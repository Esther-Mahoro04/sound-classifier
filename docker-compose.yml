services:
  api:
    build: .
    image: sound-app
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
      - ./data:/app/data

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  ui:
    image: sound-app
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://nginx
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
      - ./data:/app/data
    depends_on:
      - nginx